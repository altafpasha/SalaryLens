[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salarylens-ai"
version = "0.1.0"
description = "SalaryLens AI by CodeSec - Production AI Bank Statement Salary Detection Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "CodeSec Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "reportlab>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
